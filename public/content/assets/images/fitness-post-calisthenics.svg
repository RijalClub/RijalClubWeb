<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Home calisthenics cover</title>
  <desc id="desc">Abstract cover art for beginner home workout article.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111b" />
      <stop offset="50%" stop-color="#121a24" />
      <stop offset="100%" stop-color="#1b1f16" />
    </linearGradient>
    <radialGradient id="pulse" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#8ef0d8" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#8ef0d8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)" />
  <rect width="1600" height="900" fill="url(#pulse)" />

  <g transform="translate(1040 150)">
    <rect x="0" y="0" width="380" height="520" rx="28" fill="rgba(9,19,24,0.62)" stroke="rgba(255,255,255,0.14)" />
    <text x="34" y="74" fill="#9beed7" font-family="Sora, sans-serif" font-size="34" font-weight="700">Starter Circuit</text>
    <text x="34" y="128" fill="#f3f6f7" font-family="Sora, sans-serif" font-size="26">Push-ups</text>
    <text x="34" y="176" fill="#f3f6f7" font-family="Sora, sans-serif" font-size="26">Bodyweight Squats</text>
    <text x="34" y="224" fill="#f3f6f7" font-family="Sora, sans-serif" font-size="26">Chair Dips</text>
    <text x="34" y="272" fill="#f3f6f7" font-family="Sora, sans-serif" font-size="26">Plank Hold</text>
    <text x="34" y="320" fill="#f3f6f7" font-family="Sora, sans-serif" font-size="26">Glute Bridges</text>
    <text x="34" y="386" fill="#b2c4cb" font-family="Sora, sans-serif" font-size="22">20-30 min • 3 rounds</text>
    <text x="34" y="430" fill="#b2c4cb" font-family="Sora, sans-serif" font-size="22">No gym required</text>
  </g>

  <text x="94" y="220" fill="#91f3d6" font-family="Sora, sans-serif" font-size="34" font-weight="700" letter-spacing="2">
    HOME TRAINING BLUEPRINT
  </text>
  <text x="94" y="340" fill="#f5f9f9" font-family="Sora, sans-serif" font-size="94" font-weight="800">
    BEGINNER
  </text>
  <text x="94" y="450" fill="#d6ffb6" font-family="Sora, sans-serif" font-size="94" font-weight="800">
    CALISTHENICS
  </text>
  <text x="94" y="540" fill="#b7c7ce" font-family="Sora, sans-serif" font-size="38">
    Build strength at home with clean, repeatable sessions.
  </text>

  <g opacity="0.35" stroke="#93f2da" stroke-width="2" fill="none">
    <path d="M110 640C310 610 470 700 620 660C760 624 855 544 996 572" />
    <path d="M110 688C310 658 470 748 620 710C760 674 855 594 996 622" />
  </g>
