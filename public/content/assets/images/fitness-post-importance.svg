<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fitness and Deen cover</title>
  <desc id="desc">Abstract cover art with motivational text for Islamic fitness article.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04181a" />
      <stop offset="55%" stop-color="#0b2025" />
      <stop offset="100%" stop-color="#122214" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.18" r="0.8">
      <stop offset="0%" stop-color="#72f1c8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#72f1c8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.82" r="0.7">
      <stop offset="0%" stop-color="#b4ff72" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#b4ff72" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glowA)" />
  <rect width="1600" height="900" fill="url(#glowB)" />

  <g opacity="0.25" stroke="#8debcf" stroke-width="2" fill="none">
    <circle cx="1340" cy="190" r="120" />
    <circle cx="1260" cy="250" r="50" />
    <circle cx="1210" cy="130" r="30" />
  </g>

  <rect x="94" y="118" width="630" height="56" rx="28" fill="rgba(115,242,194,0.16)" />
  <text x="126" y="154" fill="#a5f9dc" font-family="Sora, sans-serif" font-size="30" font-weight="700" letter-spacing="2">
    FITNESS • DISCIPLINE • IHSAN
  </text>

  <text x="94" y="306" fill="#f4f8f8" font-family="Sora, sans-serif" font-size="96" font-weight="800">
    STRONG BODY,
  </text>
  <text x="94" y="420" fill="#c9ffd6" font-family="Sora, sans-serif" font-size="96" font-weight="800">
    STEADFAST HEART
  </text>

  <text x="98" y="522" fill="#b6c7ce" font-family="Sora, sans-serif" font-size="40">
    Build energy for worship, service, and daily consistency.
  </text>

  <g transform="translate(96 630)">
    <rect width="680" height="160" rx="22" fill="rgba(3,12,15,0.55)" stroke="rgba(255,255,255,0.16)" />
    <text x="34" y="68" fill="#e2f2f2" font-family="Sora, sans-serif" font-size="34" font-weight="700">
      Small habits. Big barakah.
    </text>
    <text x="34" y="116" fill="#9cb0b7" font-family="Sora, sans-serif" font-size="28">
      Stay consistent, stay sincere.
    </text>
  </g>
</svg>
